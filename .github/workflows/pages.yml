name: Pages

# Builds the browser playground (playground/) and deploys it to GitHub Pages at
# https://larplarp67.github.io/invoicelint/. Needs Settings → Pages → Build and
# deployment → Source set to "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'playground/**'
      - 'src/**'
      # The example invoices are bundled from here.
      - 'test/real-world/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A newer push waits instead of cancelling one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Playground tests
        run: pnpm exec vitest run playground
      - run: pnpm playground:build
      # Fails early, with a clear message, if Pages isn't set to deploy from Actions.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job can deploy, and only with a short-lived OIDC token.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
